<h2>Login</h2>

<form [formGroup]="loginForm">
    <div>
        <label>Email</label>
        <input type="text" formControlName="email">
    </div>
    <div>
        <label>Password</label>
        <input type="password" formControlName="password">
    </div>
    <button type="button" (click)="login()">
        Login
    </button>
</form>
